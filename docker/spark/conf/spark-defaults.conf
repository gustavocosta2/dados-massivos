spark.master                                spark://enem-spark-master:7077
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type              jdbc
spark.sql.catalog.iceberg.uri               jdbc:postgresql://enem-postgres:5432/iceberg_catalog
spark.sql.catalog.iceberg.jdbc.user         enem_admin
spark.sql.catalog.iceberg.jdbc.password     enem_admin_pass
spark.sql.catalog.iceberg.warehouse         s3a://warehouse/
spark.sql.defaultCatalog                    iceberg
spark.hadoop.fs.s3a.endpoint                http://enem-minio:9000
spark.hadoop.fs.s3a.access.key              enem_minio
spark.hadoop.fs.s3a.secret.key              enem_minio_pass
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled  false
